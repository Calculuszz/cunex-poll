services:
  db:
    image: postgres:16-alpine
    container_name: voting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: voting
      POSTGRES_PASSWORD: voting
      POSTGRES_DB: voting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # สคริปต์ใน db/init จะรันเฉพาะตอนสร้าง volume ใหม่ ถ้าอยากรีเซ็ตใช้ `docker compose down -v`
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
