# Local development dependencies. Production uses managed Postgres/Redis.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pollcunex
      POSTGRES_PASSWORD: pollcunex
      POSTGRES_DB: pollcunex
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollcunex"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
